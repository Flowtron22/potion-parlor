<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142b2a"><title>Potion Parlor</title><meta name="description" content="A colorful portrait potion puzzle."><link rel="stylesheet" href="style.css"></head>
<body><main class="app"><header><a class="brand" href="./" aria-label="Potion Parlor home"><span class="brand-icon">✧</span><span>POTION PARLOR</span></a><button id="sound" class="icon" aria-label="Enable sound">♪</button></header><section class="game" aria-label="Potion puzzle"><div class="board-top"><span>✦ <span id="level">01</span></span><span id="count" aria-label="Bottles completed"></span></div><div class="progress"><div id="progress"></div></div><canvas id="game" aria-label="Potion gems"></canvas><div id="rack" class="rack" aria-label="Brewing shelf"></div><div class="shelf-line" aria-hidden="true"></div><div id="queues" class="queues" aria-label="Bottle queues"></div><footer class="game-footer"><button id="undo" aria-label="Undo">↶</button><span class="gem-count" aria-label="Gems remaining">◇ <span id="gems"></span></span><button id="restart" aria-label="Restart">⟳</button></footer></section></main><div class="modal-backdrop hidden" id="modal"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle"></h2><button id="modalAction" class="primary"></button></section></div><script src="game.js"></script><script type="module" src="fluid.js"></script></body></html>
