<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142b2a"><title>Potion Parlor</title><meta name="description" content="A colorful portrait potion puzzle."><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="rankings.css"><link rel="stylesheet" href="blockers.css"><link rel="stylesheet" href="mastery.css?v=4"><link rel="stylesheet" href="spells.css?v=4"></head>
<body><main class="app"><header><a class="brand" href="./" aria-label="Potion Parlor home"><span class="brand-icon">✧</span><span>POTION PARLOR</span></a><button id="daily" class="daily-switch" aria-label="Switch between daily challenge and journey">Daily</button><button id="leaderboard" class="icon" aria-label="Shared leaderboard">♜</button><button id="sound" class="icon" aria-label="Enable sound">♪</button></header><button id="titleButton" class="title-button" aria-haspopup="dialog" aria-controls="masteryPanel"><span id="titleRune" class="title-rune" aria-hidden="true">◇</span><span class="title-copy"><strong id="titleName">Squire</strong><meter id="titleMeter" min="0" max="1" value="0" aria-label="Title progress"></meter></span><span id="titleXP">0 XP</span><span class="title-chevron" aria-hidden="true">›</span></button><section class="game" aria-label="Potion puzzle"><div class="board-top"><span>✦ <span id="level">01</span></span><span id="medals" class="medals" aria-label="Best medal"></span><span id="count" aria-label="Bottles completed"></span></div><div class="scorebar"><strong id="score">0</strong><span id="combo">×1</span><span id="rankMode">Ranked</span></div><div id="scoreFlash" class="score-flash" aria-live="polite"></div><div class="progress"><div id="progress"></div></div><div id="spellPrompt" class="spell-prompt hidden" role="status"><span id="spellText"></span><button id="cancelSpell">Cancel</button></div><canvas id="game" aria-label="Potion gems"></canvas><div id="rack" class="rack" aria-label="Brewing shelf"></div><div class="shelf-line" aria-hidden="true"></div><div id="essenceBank" class="essence-bank hidden" aria-label="Stored potion essence"></div><div id="queues" class="queues" aria-label="Bottle queues"></div><div class="spellbar" aria-label="Mana spells"><span class="mana-wallet" title="Spend Mana on spells; titles use separate XP">✦ <strong id="manaBalance">50</strong> <small>MP</small></span><button id="dispel" aria-label="Dispel one gem"
