<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142b2a"><title>Potion Parlor</title><meta name="description" content="A colorful portrait potion puzzle."><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="rankings.css"></head>
<body><main class="app"><header><a class="brand" href="./" aria-label="Potion Parlor home"><span class="brand-icon">✧</span><span>POTION PARLOR</span></a><button id="leaderboard" class="icon" aria-label="Shared leaderboard">♜</button><button id="sound" class="icon" aria-label="Enable sound">♪</button></header><section class="game" aria-label="Potion puzzle"><div class="board-top"><span>✦ <span id="level">01</span></span><span id="count" aria-label="Bottles completed"></span></div><div class="scorebar"><strong id="score">0</strong><span id="combo">×1</span><span id="rankMode">Ranked</span></div><div id="scoreFlash" class="score-flash" aria-live="polite"></div><div class="progress"><div id="progress"></div></div><canvas id="game" aria-label="Potion gems"></canvas><div id="rack" class="rack" aria-label="Brewing shelf"></div><div class="shelf-line" aria-hidden="true"></div><div id="queues" class="queues" aria-label="Bottle queues"></div><footer class="game-footer"><button id="undo" aria-label="Undo">↶</button><button id="shake" class="gem-count" aria-label="Gently shake the jar">◇ <span id="gems"></span></button><button id="restart" aria-label="Restart">⟳</button></footer></section></main><div id="leaderboardPanel" class="modal-backdrop hidden"><section class="modal rankings" role="dialog" aria-modal="true" aria-labelledby="rankingTitle"><button id="closeLeaderboard" class="close" aria-label="Close leaderboard">×</button><h2 id="rankingTitle">Leaderboard</h2><div class="ranking-filter"><button id="rankPrev" aria-label="Previous level">‹</button><span id="rankLevel"></span><button id="rankNext" aria-label="Next level">›</button></div><button id="rankPlay" class="primary rank-play">Play</button><ol id="rankings"></ol><p id="rankingStatus" role="status"></p></section></div><div class="modal-backdrop hidden" id="modal"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle"></h2><p id="resultScore"></p><div id="submitScore" class="hidden"><input id="playerName" aria-label="Leaderboard name" maxlength="18" placeholder="Your name" autocomplete="nickname"><button id="postScore">Submit score</button><p id="submitStatus" role="status"></p></div><button id="modalAction" class="primary"></button></section></div><script src="vendor/matter.min.js"></script><script src="physics.js"></script><script src="level-builder.js"></script><script src="frame-meter.js"></script><script src="scoring.js"></script><script src="online.js"></script><script src="game.js"></script><script type="module" src="fluid.js"></script></body></html>
